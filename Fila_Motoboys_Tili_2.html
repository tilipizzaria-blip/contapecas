<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fila de Motoboys Tili</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: quadro de expedição de uma tela — fila | na rua + pausa | resumo do dia; abas para detalhe. Escuro de propósito: é tela de balcão à noite. */
:root{
  --bg:#0e1322; --panel:#161c2d; --panel2:#1d2538; --line:#2a3450; --line2:#36425f;
  --fg:#eef1f8; --muted:#94a1bb; --faint:#5f6b85;
  --accent:#d62828; --accent-hi:#f03a3a; --gold:#f2b705; --gold-dim:#8a6a07;
  --ok:#2bd576; --warn:#f5a524; --crit:#ff5c5c;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px; --radius-sm:9px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---- cabeçalho ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;color:#fff;flex:none}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-body);font-weight:600}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600}
.tab:hover{color:var(--fg);background:var(--panel2)}
.tab.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.clock{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--fg);min-width:70px;text-align:right}
.btn-tv{padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--line2);color:var(--muted);font-weight:600;font-size:13px}
.btn-tv:hover{color:var(--fg);border-color:var(--gold)}

/* ---- conteúdo ---- */
.wrap{padding-block:16px 28px;padding-inline:16px;max-width:1500px;margin:0 auto}
.board{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.85fr);gap:16px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.board>.col-hoje{grid-column:1/-1}}
@media (max-width:720px){.board{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head h2{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--panel2);color:var(--fg);font-weight:700;font-size:13px;border:1px solid var(--line2)}
.card-head .sp{flex:1}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--faint);font-size:14px;padding:10px 2px}

/* próximo */
.proximo{background:linear-gradient(160deg,#1b2238,#121829);border:1px solid var(--line2);border-radius:var(--radius);padding:16px 18px 18px;position:relative;overflow:hidden}
.proximo::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--gold)}
.proximo .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.proximo .nome{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,6vw,72px);line-height:.95;text-transform:uppercase;margin-top:6px;overflow-wrap:anywhere}
.proximo .nome.vazio{font-size:clamp(26px,3vw,34px);color:var(--muted);font-weight:700;text-transform:none}
.proximo .sub{color:var(--muted);margin-top:6px;font-size:14px}
.proximo .acao{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;border:1px solid transparent;line-height:1.1;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hi)}
.btn-ok{background:var(--ok);color:#06240f}
.btn-ok:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{border-color:var(--line2);color:var(--fg);background:transparent}
.btn-ghost:hover:not(:disabled){background:var(--panel2)}
.btn-gold{background:var(--gold);color:#241a00}
.btn-danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn-danger:hover{background:rgba(255,92,92,.12)}
.btn-lg{font-size:17px;padding:14px 22px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-display);font-size:21px}
.btn-sm{padding:7px 10px;font-size:13px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:var(--radius-sm);border:1px solid var(--line2);color:var(--muted);display:inline-grid;place-items:center;font-size:15px}
.btn-icon:hover:not(:disabled){color:var(--fg);background:var(--panel2)}

/* listas */
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px}
@media (max-width:560px){.item{grid-template-columns:auto minmax(0,1fr);gap:8px 12px}.item .acts{grid-column:1/-1;justify-content:flex-start}}
.item.first{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-dim)}
.item.warn{border-color:var(--warn)}
.item.crit{border-color:var(--crit);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,92,0)}50%{box-shadow:0 0 0 4px rgba(255,92,92,.25)}}
@media (prefers-reduced-motion:reduce){.item.crit{animation:none}}
.pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:17px;background:var(--panel);border:1px solid var(--line2);color:var(--muted)}
.item.first .pos{background:var(--gold);color:#241a00;border-color:var(--gold)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:16px;color:#fff;flex:none}
.opcao{min-width:0}.opcao>span+*{min-width:0}
.item .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.item .nome{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1;text-transform:uppercase;overflow-wrap:break-word}
.item .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.item .meta b{color:var(--fg);font-weight:600}
.t-warn{color:var(--warn)!important}.t-crit{color:var(--crit)!important;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--fg)}
.chip.gold{border-color:var(--gold-dim);color:var(--gold)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.menu-pop button{text-align:left;padding:8px 10px;border-radius:7px;font-weight:600;font-size:14px}
.menu-pop button:hover{background:var(--panel2)}
.menu-pop button.danger{color:var(--crit)}
.alerta-bar{display:flex;align-items:center;gap:10px;background:rgba(255,92,92,.12);border:1px solid var(--crit);border-radius:var(--radius-sm);padding:8px 12px;color:var(--fg);font-weight:600;font-size:14px}
.alerta-bar.warn{background:rgba(245,165,36,.12);border-color:var(--warn)}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(242,183,5,.1);border:1px solid var(--gold-dim);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;margin-bottom:14px}

/* resumo do dia (coluna) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.tile .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px}
.rank{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rank li:last-child{border-bottom:0}
.rank .n{font-weight:700;text-transform:uppercase;font-family:var(--font-display);font-size:17px;overflow-wrap:anywhere}
.rank .s{color:var(--muted);font-size:12px}
.rank .k{font-family:var(--font-display);font-weight:800;font-size:20px;text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:middle}
.dot.fila{background:var(--gold)}.dot.rota{background:var(--accent-hi)}.dot.pausa{background:var(--warn)}

/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--panel2);position:sticky;top:0}
td.r,th.r{text-align:right}
td.num,td.nw,th{white-space:nowrap}
tr.total td{font-weight:700;background:var(--panel2)}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.03em}
.tag.fila{background:rgba(242,183,5,.15);color:var(--gold)}.tag.rota{background:rgba(240,58,58,.15);color:var(--accent-hi)}.tag.pausa{background:rgba(245,165,36,.15);color:var(--warn)}.tag.fora{background:var(--panel2);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.in{background:var(--bg);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:9px 11px;min-height:40px;width:100%;min-width:0}
.in:focus{border-color:var(--gold)}
select.in{appearance:auto}
textarea.in{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>.field{flex:1 1 160px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.check{display:flex;align-items:center;gap:10px;font-weight:600;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.sec-title{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 10px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,8,16,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);width:min(540px,100%);max-height:92vh;overflow:auto;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.modal .sub{color:var(--muted);margin-top:-8px}
.modal .acts{justify-content:flex-end;margin-top:4px}
.pin{letter-spacing:.5em;text-align:center;font-family:var(--font-display);font-size:30px;font-weight:700;max-width:220px}
.opcoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opcao{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--panel2);font-weight:700;text-transform:uppercase;font-family:var(--font-display);font-size:18px;text-align:left}
.opcao:hover{border-color:var(--gold)}
.opcao.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pedidos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:6px 8px;min-height:44px}
.pedidos .chip{font-size:14px;padding:3px 9px;display:inline-flex;gap:6px;align-items:center}
.pedidos .chip button{color:var(--muted);font-size:15px;line-height:1}
.pedidos input{background:none;border:0;min-width:110px;flex:1;padding:4px;outline:none}
.resumo-viagem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.resumo-viagem .tile .v{font-size:26px}
.erro{color:var(--crit);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--fg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast.ok{border-color:var(--ok)}.toast.crit{border-color:var(--crit)}

/* modo TV */
.tv{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;grid-template-rows:auto 1fr;padding:3vh 4vw;gap:3vh}
.tv .head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-family:var(--font-display);font-size:clamp(20px,3vw,34px);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.tv .main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:4vw;min-height:0}
.tv .prox,.tv .rota{min-width:0}
@media (max-width:800px){.tv .main{grid-template-columns:minmax(0,1fr)}}
.tv .prox .lbl{color:var(--gold);font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:clamp(18px,2.4vw,30px);text-transform:uppercase}
.tv .prox .nome{font-family:var(--font-display);font-weight:800;font-size:clamp(70px,13vw,190px);line-height:.9;text-transform:uppercase;overflow-wrap:anywhere}
.tv .prox .nome.vazio{font-size:clamp(34px,5vw,64px);color:var(--muted)}
.tv .seg{margin-top:3vh;display:flex;flex-direction:column;gap:1.2vh}
.tv .seg div{font-family:var(--font-display);font-size:clamp(26px,3.6vw,52px);font-weight:700;text-transform:uppercase;color:var(--fg);display:flex;gap:16px;align-items:baseline}
.tv .seg span{color:var(--muted);font-size:.6em;font-weight:600}
.tv .rota h3{color:var(--accent-hi);font-size:clamp(18px,2.4vw,30px);letter-spacing:.14em;text-transform:uppercase;margin-bottom:1.5vh}
.tv .rota div{font-family:var(--font-display);font-size:clamp(26px,3.4vw,48px);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding:.6vh 0}
.tv .rota div>span:first-child{min-width:0;overflow-wrap:break-word}
.tv .rota div>span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.tv .prox .nome,.proximo .nome{white-space:nowrap}
.tv .prox .nome.quebra,.proximo .nome.quebra{white-space:normal;overflow-wrap:anywhere}
.tv .sair{position:absolute;right:16px;bottom:16px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">T</div>
    <div><h1 id="h-loja">Fila de Motoboys</h1><small id="h-sub">Tili Pizzaria · Expedição</small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="fila">Fila</button>
    <button class="tab" data-tab="hoje">Números do dia</button>
    <button class="tab" data-tab="hist">Histórico</button>
    <button class="tab" data-tab="admin">Admin</button>
  </nav>
  <button class="btn-tv" id="btn-tv" title="Tela grande para a expedição">Modo TV</button>
  <div class="clock num" id="clock">--:--</div>
</header>

<main class="wrap">
  <div id="demo-bar" class="demo-bar" hidden>
    <strong>Dados de exemplo.</strong><span class="hint">Os nomes e as viagens abaixo são fictícios, só para mostrar como o quadro funciona.</span>
    <button class="btn btn-sm btn-ghost" id="btn-limpar-demo">Apagar o exemplo e começar do zero</button>
  </div>
  <section id="view-fila"></section>
  <section id="view-hoje" hidden></section>
  <section id="view-hist" hidden></section>
  <section id="view-admin" hidden></section>
</main>

<div id="modal-root"></div>
<div id="tv-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   Fila de Motoboys Tili — v2 (arquivo único, dados no navegador)
   ============================================================ */
const DEMO = false;                 // true = carrega um dia de exemplo na primeira abertura
const KEY = 'tili_fila_motoboys_v2';
const CORES = ['#d62828','#2b7de9','#1fa86b','#b84bd6','#e08a1e','#0fa3b1','#c93d7a','#6b7bd6','#8a9a1b','#d65a2b'];

/* ---------- estado ---------- */
function estadoInicial(){
  return { v:2,
    cfg:{ loja:'Tili Pizzaria', alertaMin:30, criticoMin:45, virada:6, som:true, pedirPedido:true, pin:'' },
    motoboys:[], fila:[], rota:[], pausa:[], turnos:{}, turnosHist:[], viagens:[], eventos:[], seq:1 };
}
let S = null;
function carregar(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(s && s.v===2) return s; } }catch(e){ console.warn('storage read', e); }
  return null;
}
function salvar(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ console.warn('storage write', e); toast('Não consegui gravar no navegador — os dados podem se perder ao fechar', 'crit'); }
}

/* ---------- utilidades ---------- */
const agora = () => Date.now();
const pad = n => String(n).padStart(2,'0');
const hm = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dmy = iso => iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);
const minutos = (a,b) => Math.max(0, Math.round((b-a)/60000));
const fmtMin = m => (m==null||isNaN(m)) ? '—' : (m < 60 ? m+' min' : Math.floor(m/60)+'h'+pad(m%60));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function diaOp(ts){ const d = new Date(ts - (S.cfg.virada||0)*3600000); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const hojeOp = () => diaOp(agora());
const byId = id => S.motoboys.find(m => m.id===id);
const nomeDe = (id, snap) => { const m = byId(id); return m ? m.nome : (snap || 'Motoboy removido'); };
const corDe = id => { const m = byId(id); return (m && m.cor) || '#5f6b85'; };
const inicial = n => (n||'?').trim().charAt(0).toUpperCase();
function statusDe(id){
  if(S.rota.some(r=>r.id===id)) return 'rota';
  if(S.fila.some(f=>f.id===id)) return 'fila';
  if(S.pausa.some(p=>p.id===id)) return 'pausa';
  return 'fora';
}
const STATUS_LBL = { fila:'Na fila', rota:'Na rua', pausa:'Em pausa', fora:'Fora do turno' };
function log(tipo, id, det){ S.eventos.push({ ts:agora(), tipo, id:id||null, det:det||'' }); }
function limparAntigos(){
  const lim60 = agora() - 60*86400000, lim400 = agora() - 400*86400000;
  if(S.eventos.length > 3000 || (S.eventos[0] && S.eventos[0].ts < lim60)) S.eventos = S.eventos.filter(e => e.ts >= lim60).slice(-3000);
  if(S.viagens[0] && S.viagens[0].saiuEm < lim400) S.viagens = S.viagens.filter(v => v.saiuEm >= lim400);
  if(S.turnosHist[0] && S.turnosHist[0].inicio < lim400) S.turnosHist = S.turnosHist.filter(t => t.inicio >= lim400);
}
function commit(){ limparAntigos(); salvar(); render(); }

/* ---------- som ---------- */
let audioCtx = null;
function armarAudio(){ try{ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(vezes){
  if(!S.cfg.som || !audioCtx) return;
  try{
    for(let i=0;i<(vezes||2);i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='square'; o.frequency.value = 880; g.gain.value = 0.0001;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i*0.28;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.start(t); o.stop(t+0.24);
    }
  }catch(e){}
}
document.addEventListener('pointerdown', armarAudio, { once:true });

/* ---------- ações ---------- */
function emAlgumLugar(id){ return statusDe(id)!=='fora'; }
function ativar(id){
  if(emAlgumLugar(id)) return;
  S.fila.push({ id, desde:agora() });
  S.turnos[id] = { inicio:agora() };
  log('ATIVOU', id, 'entrou na fila');
  commit(); toast(nomeDe(id)+' entrou na fila', 'ok');
}
function sair(id, d){
  const i = S.fila.findIndex(f=>f.id===id); if(i<0) return;
  const f = S.fila.splice(i,1)[0];
  const pedidos = (d.pedidos||[]).slice(0,20), entregas = Math.max(1, Number(d.entregas)||pedidos.length||1);
  S.rota.push({ id, saiuEm:agora(), entrouFila:f.desde, pedidos, bairro:(d.bairro||'').trim(), entregas, obs:(d.obs||'').trim(), alerta:0 });
  log('SAIU', id, resumoSaida({pedidos, bairro:d.bairro, entregas}));
  commit(); toast(nomeDe(id)+' saiu para entrega', 'ok');
}
function resumoSaida(r){
  const p = r.pedidos && r.pedidos.length ? 'pedido(s) '+r.pedidos.map(x=>'#'+x).join(', ') : 'sem nº de pedido';
  return p + (r.bairro ? ' · '+r.bairro : '') + ' · '+r.entregas+' entrega(s)';
}
function voltar(id, d){
  const i = S.rota.findIndex(r=>r.id===id); if(i<0) return;
  const r = S.rota.splice(i,1)[0];
  const v = { vid:S.seq++, id, nome:nomeDe(id), saiuEm:r.saiuEm, voltouEm:agora(), espera:minutos(r.entrouFila||r.saiuEm, r.saiuEm),
              pedidos:r.pedidos||[], bairro:r.bairro||'', entregas:Math.max(0, Number(d.entregas)!=null && !isNaN(Number(d.entregas)) ? Number(d.entregas) : r.entregas), obs:r.obs||'' };
  S.viagens.push(v);
  log('VOLTOU', id, fmtMin(minutos(r.saiuEm, v.voltouEm))+' na rua · '+v.entregas+' entrega(s)'+(d.encerrar?' · encerrou o turno':''));
  if(d.encerrar) fecharTurno(id); else S.fila.push({ id, desde:agora() });
  commit(); toast(nomeDe(id)+' voltou'+(d.encerrar?' e encerrou o turno':' — fim da fila'), 'ok');
}
function pausar(id, motivo){
  const i = S.fila.findIndex(f=>f.id===id); if(i<0) return;
  S.fila.splice(i,1); S.pausa.push({ id, desde:agora(), motivo:motivo||'' });
  log('PAUSA', id, motivo||''); commit();
}
function retomar(id){
  const i = S.pausa.findIndex(p=>p.id===id); if(i<0) return;
  S.pausa.splice(i,1); S.fila.push({ id, desde:agora() });
  log('RETOMOU', id, 'voltou da pausa para o fim da fila'); commit();
}
function fecharTurno(id){
  const t = S.turnos[id]; if(t){ S.turnosHist.push({ id, nome:nomeDe(id), inicio:t.inicio, fim:agora() }); delete S.turnos[id]; }
}
function encerrar(id){
  if(S.rota.some(r=>r.id===id)){ toast('Registre a volta antes de encerrar o turno', 'crit'); return; }
  S.fila = S.fila.filter(f=>f.id!==id); S.pausa = S.pausa.filter(p=>p.id!==id);
  fecharTurno(id); log('ENCERROU', id, 'saiu do turno'); commit(); toast(nomeDe(id)+' encerrou o turno');
}
function mover(id, dir){
  const i = S.fila.findIndex(f=>f.id===id), j = i+dir; if(i<0||j<0||j>=S.fila.length) return;
  [S.fila[i], S.fila[j]] = [S.fila[j], S.fila[i]];
  log('REORDENOU', id, dir<0?'subiu uma posição':'desceu uma posição'); commit();
}
function furar(id){
  const i = S.fila.findIndex(f=>f.id===id); if(i<=0) return;
  const f = S.fila.splice(i,1)[0]; S.fila.unshift(f);
  log('FUROU_FILA', id, 'passou para o 1º da fila'); commit();
}
function paraFim(id){
  const i = S.fila.findIndex(f=>f.id===id); if(i<0||i===S.fila.length-1) return;
  const f = S.fila.splice(i,1)[0]; S.fila.push(f);
  log('REORDENOU', id, 'foi para o fim da fila'); commit();
}
function editarRota(id, d){
  const r = S.rota.find(r=>r.id===id); if(!r) return;
  r.pedidos = (d.pedidos||[]).slice(0,20); r.bairro=(d.bairro||'').trim(); r.entregas=Math.max(1,Number(d.entregas)||1); r.obs=(d.obs||'').trim();
  log('EDITOU', id, 'saída: '+resumoSaida(r)); commit();
}
function editarViagem(vid, d){
  const v = S.viagens.find(v=>v.vid===vid); if(!v) return;
  v.pedidos=(d.pedidos||[]).slice(0,20); v.bairro=(d.bairro||'').trim(); v.entregas=Math.max(0,Number(d.entregas)||0); v.obs=(d.obs||'').trim();
  log('EDITOU', v.id, 'viagem das '+hm(v.saiuEm)+': '+v.entregas+' entrega(s)'); commit();
}
function excluirViagem(vid){ const v = S.viagens.find(v=>v.vid===vid); if(!v) return; S.viagens = S.viagens.filter(x=>x.vid!==vid); log('EXCLUIU', v.id, 'viagem das '+hm(v.saiuEm)); commit(); }
function encerrarDia(){
  const ids = [...S.fila.map(f=>f.id), ...S.pausa.map(p=>p.id)];
  if(S.rota.length){ toast('Ainda tem motoboy na rua — registre as voltas primeiro', 'crit'); return; }
  ids.forEach(id => { fecharTurno(id); });
  S.fila = []; S.pausa = [];
  log('ENCERROU_DIA', null, ids.length+' turno(s) encerrado(s)'); commit(); toast('Dia encerrado — fila zerada', 'ok');
}
function fecharTurnosEsquecidos(){
  // turno com mais de 14h aberto (alguém esqueceu de encerrar): fecha sozinho
  let n = 0;
  Object.keys(S.turnos).forEach(k => { const id = Number(k); const t = S.turnos[id];
    if(agora() - t.inicio > 14*3600000 && !S.rota.some(r=>r.id===id)){ S.fila = S.fila.filter(f=>f.id!==id); S.pausa = S.pausa.filter(p=>p.id!==id); fecharTurno(id); log('ENCERROU', id, 'turno fechado automaticamente (mais de 14h aberto)'); n++; } });
  if(n) { salvar(); }
}
function cadastrar(nome, tel){
  nome = (nome||'').trim(); if(!nome) return null;
  const id = S.seq++; S.motoboys.push({ id, nome, tel:(tel||'').trim(), cor:CORES[(S.motoboys.length)%CORES.length], arquivado:false, criadoEm:agora() });
  log('CADASTRO', id, 'cadastrado'); commit(); return id;
}
function editarMotoboy(id, nome, tel, cor){ const m = byId(id); if(!m) return; m.nome=(nome||m.nome).trim(); m.tel=(tel||'').trim(); if(cor) m.cor=cor; log('CADASTRO', id, 'dados alterados'); commit(); }
function arquivar(id, flag){ const m = byId(id); if(!m) return; if(flag && emAlgumLugar(id)){ toast('Encerre o turno antes de arquivar', 'crit'); return; } m.arquivado=!!flag; log('CADASTRO', id, flag?'arquivado':'reativado'); commit(); }
function excluirMotoboy(id){ if(emAlgumLugar(id)){ toast('Encerre o turno antes de excluir', 'crit'); return; } const m = byId(id); S.motoboys = S.motoboys.filter(x=>x.id!==id); log('CADASTRO', null, 'excluiu '+(m?m.nome:id)); commit(); }

/* ---------- cálculos ---------- */
function diasDisponiveis(){
  const set = new Set([hojeOp()]);
  S.viagens.forEach(v => set.add(diaOp(v.saiuEm)));
  S.turnosHist.forEach(t => set.add(diaOp(t.inicio)));
  Object.values(S.turnos).forEach(t => set.add(diaOp(t.inicio)));
  return [...set].sort().reverse();
}
function resumoDia(dia){
  const viagens = S.viagens.filter(v => diaOp(v.saiuEm)===dia);
  const turnos = [...S.turnosHist.filter(t=>diaOp(t.inicio)===dia), ...Object.entries(S.turnos).filter(([id,t])=>diaOp(t.inicio)===dia).map(([id,t])=>({id:Number(id), inicio:t.inicio, fim:null}))];
  const ids = new Set([...viagens.map(v=>v.id), ...turnos.map(t=>t.id)]);
  if(dia===hojeOp()) [...S.fila, ...S.rota, ...S.pausa].forEach(x => ids.add(x.id));
  const porMotoboy = [...ids].map(id => {
    const vs = viagens.filter(v=>v.id===id);
    const ts = turnos.filter(t=>t.id===id);
    const entregas = vs.reduce((a,v)=>a+(v.entregas||0),0);
    const tempoRua = vs.reduce((a,v)=>a+minutos(v.saiuEm,v.voltouEm),0);
    const esperas = vs.map(v=>v.espera).filter(x=>x!=null);
    const emRota = S.rota.find(r=>r.id===id);
    const entrou = ts.length ? Math.min(...ts.map(t=>t.inicio)) : null;
    const saiuTurno = ts.length && ts.every(t=>t.fim) ? Math.max(...ts.map(t=>t.fim)) : null;
    const ultima = vs.length ? Math.max(...vs.map(v=>v.voltouEm)) : null;
    return { id, nome:nomeDe(id, vs[0]&&vs[0].nome || ts[0]&&ts[0].nome), viagens:vs.length, entregas, tempoRua,
      medioRua: vs.length ? Math.round(tempoRua/vs.length) : null,
      esperaMedia: esperas.length ? Math.round(esperas.reduce((a,b)=>a+b,0)/esperas.length) : null,
      maior: vs.length ? Math.max(...vs.map(v=>minutos(v.saiuEm,v.voltouEm))) : null,
      entrou, saiuTurno, ultima, status: dia===hojeOp() ? statusDe(id) : 'fora',
      emRotaMin: emRota ? minutos(emRota.saiuEm, agora()) : null };
  }).sort((a,b)=> b.entregas-a.entregas || b.viagens-a.viagens || a.nome.localeCompare(b.nome));
  const tot = { viagens:viagens.length, entregas:viagens.reduce((a,v)=>a+(v.entregas||0),0), motoboys:porMotoboy.length,
    medioRua: viagens.length ? Math.round(viagens.reduce((a,v)=>a+minutos(v.saiuEm,v.voltouEm),0)/viagens.length) : null,
    maior: viagens.length ? Math.max(...viagens.map(v=>minutos(v.saiuEm,v.voltouEm))) : null,
    esperaMedia: (()=>{ const e = viagens.map(v=>v.espera).filter(x=>x!=null); return e.length ? Math.round(e.reduce((a,b)=>a+b,0)/e.length) : null; })() };
  return { dia, viagens, porMotoboy, tot };
}
function bairrosConhecidos(){
  const c = {}; S.viagens.slice(-400).forEach(v => { if(v.bairro) c[v.bairro]=(c[v.bairro]||0)+1; }); S.rota.forEach(r=>{ if(r.bairro) c[r.bairro]=(c[r.bairro]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,40);
}

function render(){
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));

}
function classeTempo(min){ if(min >= S.cfg.criticoMin) return 'crit'; if(min >= S.cfg.alertaMin) return 'warn'; return ''; }
function ajustarNome(el){ // encolhe o nome grande até caber na largura; se nem assim couber, deixa quebrar
  if(!el || el.classList.contains('vazio')) return;
  el.style.fontSize=''; el.classList.remove('quebra');
  let s = parseFloat(getComputedStyle(el).fontSize)||48; const min = Math.max(22, s*0.45);
  let guard = 60;
  while(el.scrollWidth > el.clientWidth + 1 && s > min && guard--){ s = Math.floor(s*0.92); el.style.fontSize = s+'px'; }
  if(el.scrollWidth > el.clientWidth + 1) el.classList.add('quebra');
}

/* ---------- modais ---------- */
function abrirModal(html){ $('modal-root').innerHTML = `<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; $('ov').addEventListener('click', e => { if(e.target.id==='ov') fecharModal(); }); const f = $('modal-root').querySelector('input,select,textarea,button.btn-primary'); if(f) setTimeout(()=>f.focus(),30); }
function fecharModal(){ $('modal-root').innerHTML=''; }
function chipsInput(idBase, inicial){ // campo de nº de pedidos com chips
  return `<div class="pedidos" id="${idBase}-box">${(inicial||[]).map(p=>`<span class="chip" data-p="${esc(p)}">#${esc(p)}<button type="button" data-a="chip-x" aria-label="remover">×</button></span>`).join('')}<input id="${idBase}-in" inputmode="numeric" placeholder="nº do pedido + Enter"></div>`;
}
function lerChips(idBase){ const box = $(idBase+'-box'); const arr = [...box.querySelectorAll('.chip')].map(c=>c.dataset.p); const pend = $(idBase+'-in').value.trim(); if(pend) arr.push(...pend.split(/[,\s]+/).filter(Boolean)); return [...new Set(arr)]; }
function addChip(idBase, val){ const box = $(idBase+'-box'); val.split(/[,\s]+/).filter(Boolean).forEach(v=>{ if([...box.querySelectorAll('.chip')].some(c=>c.dataset.p===v)) return; const s=document.createElement('span'); s.className='chip'; s.dataset.p=v; s.innerHTML=`#${esc(v)}<button type="button" data-a="chip-x" aria-label="remover">×</button>`; box.insertBefore(s, $(idBase+'-in')); }); $(idBase+'-in').value=''; }

function modalSaiu(id){
  if(!S.cfg.pedirPedido){ sair(id, {}); return; }
  const bairros = bairrosConhecidos();
  abrirModal(`<h3>Saiu para entrega</h3><p class="sub">${esc(nomeDe(id))} · ${hm(agora())}</p>
    <div class="field"><label>Pedidos que levou</label>${chipsInput('ped')}<span class="hint">Digite o número e aperte Enter (pode mais de um). Opcional.</span></div>
    <div class="row"><div class="field"><label for="f-bairro">Bairro / destino</label><input class="in" id="f-bairro" list="dl-bairros" placeholder="ex.: Cambolo"><datalist id="dl-bairros">${bairros.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></div>
      <div class="field" style="flex:0 1 140px"><label for="f-ent">Entregas</label><input class="in num" id="f-ent" type="number" min="1" max="20" value="1"></div></div>
    <div class="field"><label for="f-obs">Observação</label><input class="in" id="f-obs" placeholder="opcional"></div>
    <div class="acts"><button class="btn btn-ghost" data-a="fechar">Cancelar</button><button class="btn btn-primary" data-a="conf-saiu" data-id="${id}">Confirmar saída</button></div>`);
  ligarChips('ped', 'f-ent');
}
function ligarChips(idBase, entId){
  const inp = $(idBase+'-in');
  inp.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===','){ e.preventDefault(); if(inp.value.trim()){ addChip(idBase, inp.value); sincEnt(); } else if(e.key==='Enter'){ const b=$('modal-root').querySelector('[data-a="conf-saiu"],[data-a="conf-edrota"],[data-a="conf-edviagem"]'); if(b) b.click(); } } });
  inp.addEventListener('blur', () => { if(inp.value.trim()){ addChip(idBase, inp.value); sincEnt(); } });
  function sincEnt(){ const n = $(idBase+'-box').querySelectorAll('.chip').length; const e = entId && $(entId); if(e && n>0 && (!e.dataset.touched)) e.value = n; }
  const e = entId && $(entId); if(e) e.addEventListener('input', ()=>{ e.dataset.touched='1'; });
}

async function baixar(nome, conteudo){
  if(dlCap){ try{ await dlCap.save({ filename:nome, data:'﻿'+conteudo }); toast('Arquivo salvo', 'ok'); }catch(e){ if(e && e.code==='declined') return; toast('Não deu para salvar aqui — use Copiar', 'crit'); } return; }
  try{ const blob = new Blob(['﻿'+conteudo], {type: nome.endsWith('.json')?'application/json':'text/csv;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }catch(e){ toast('Download bloqueado aqui — use Copiar', 'crit'); }

/* ---------- CSV / backup ---------- */
function csv(rows){ return rows.map(r => r.map(c => { const s = String(c==null?'':c); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(';')).join('\r\n'); }
function csvResumo(dia){ const r = resumoDia(dia); const rows = [['Dia',dmy(dia)],[],['Motoboy','Entrou','Saiu do turno','Viagens','Entregas','Media na rua (min)','Mais longa (min)','Total na rua (min)','Espera media (min)','Ultima volta']];
  r.porMotoboy.forEach(p => rows.push([p.nome, p.entrou?hm(p.entrou):'', p.saiuTurno?hm(p.saiuTurno):'', p.viagens, p.entregas, p.medioRua??'', p.maior??'', p.tempoRua, p.esperaMedia??'', p.ultima?hm(p.ultima):'']));
  rows.push(['TOTAL','','',r.tot.viagens,r.tot.entregas,r.tot.medioRua??'',r.tot.maior??'',r.viagens.reduce((a,v)=>a+minutos(v.saiuEm,v.voltouEm),0),r.tot.esperaMedia??'','']);
  modalTexto('Resumo do dia '+dmy(dia), csv(rows), 'resumo_motoboys_'+dia+'.csv'); }
function csvViagens(dia){ const r = resumoDia(dia); const rows = [['Dia','Motoboy','Saiu','Voltou','Minutos na rua','Espera na fila (min)','Pedidos','Bairro','Entregas','Observacao']];
  [...r.viagens].sort((a,b)=>a.saiuEm-b.saiuEm).forEach(v => rows.push([dmy(dia), nomeDe(v.id,v.nome), hm(v.saiuEm), hm(v.voltouEm), minutos(v.saiuEm,v.voltouEm), v.espera??'', (v.pedidos||[]).join(' '), v.bairro, v.entregas, v.obs]));
  modalTexto('Viagens de '+dmy(dia), csv(rows), 'viagens_motoboys_'+dia+'.csv'); }
function exportarBackup(){ log('BACKUP', null, 'exportado'); salvar(); modalTexto('Backup completo', JSON.stringify(S), 'backup_fila_motoboys_'+hojeOp()+'.json'); }
function importarBackup(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader(); rd.onload = () => { try{ const s = JSON.parse(rd.result); if(!s || s.v!==2 || !Array.isArray(s.motoboys)) throw new Error('formato'); modalConfirmar('Importar backup', `O arquivo tem ${s.motoboys.length} motoboy(s) e ${(s.viagens||[]).length} viagem(ns). Isso substitui TODOS os dados atuais.`, 'Importar e substituir', () => { S = Object.assign(estadoInicial(), s); S.demo=false; log('BACKUP', null, 'importado'); commit(); toast('Backup importado', 'ok'); }); }catch(err){ toast('Arquivo inválido — exporte o backup por este app', 'crit'); } e.target.value=''; };
  rd.readAsText(f);
}

/* ---------- eventos de clique (delegação) ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if(!b){ if(menuAberto && !e.target.closest('.menu')){ menuAberto=null; render(); } return; }
  const a = b.dataset.a, id = Number(b.dataset.id||0), vid = Number(b.dataset.vid||0);
  switch(a){
    case 'tab-hoje': tab='hoje'; diaSel=hojeOp(); render(); break;
    case 'menu': menuAberto = (menuAberto==='f'+id) ? null : 'f'+id; render(); break;
    case 'ativar': modalAtivar(); break;
    case 'conf-ativar': fecharModal(); ativar(id); break;
    case 'novo-e-ativar': { const nome = $('novo-nome').value.trim(); if(!nome){ $('novo-nome').focus(); return; } const nid = cadastrar(nome,''); fecharModal(); if(nid) ativar(nid); break; }
    case 'saiu': menuAberto=null; modalSaiu(id); break;
    case 'conf-saiu': { const d = { pedidos:lerChips('ped'), bairro:$('f-bairro').value, entregas:$('f-ent').value, obs:$('f-obs').value }; fecharModal(); sair(id, d); break; }
    case 'voltou': modalVoltou(id); break;
    case 'conf-voltou': { const d = { entregas:$('v-ent').value, encerrar:$('v-enc').checked }; fecharModal(); voltar(id, d); break; }
    case 'edrota': modalEdRota(id); break;
    case 'conf-edrota': { const d = { pedidos:lerChips('ped'), bairro:$('f-bairro').value, entregas:$('f-ent').value, obs:$('f-obs').value }; fecharModal(); editarRota(id, d); break; }
    case 'edviagem': modalEdViagem(vid); break;
    case 'conf-edviagem': { const d = { pedidos:lerChips('ped'), bairro:$('f-bairro').value, entregas:$('f-ent').value, obs:$('f-obs').value }; fecharModal(); editarViagem(vid, d); break; }
    case 'del-viagem': fecharModal(); modalConfirmar('Excluir viagem', 'A viagem sai do histórico e dos números do dia.', 'Excluir', () => excluirViagem(vid)); break;
    case 'pausa': menuAberto=null; modalPausa(id); break;
    case 'conf-pausa': fecharModal(); pausar(id, b.dataset.m); break;
    case 'retoma': retomar(id); break;
    case 'sobe': mover(id,-1); break;
    case 'desce': mover(id,1); break;
    case 'fura': menuAberto=null; furar(id); break;
    case 'fim': menuAberto=null; paraFim(id); break;
    case 'encerra': menuAberto=null; modalConfirmar('Encerrar turno', nomeDe(id)+' sai da fila e do turno de hoje. As viagens dele continuam nos números do dia.', 'Encerrar turno', () => encerrar(id)); break;
    case 'chip-x': b.closest('.chip').remove(); break;
    case 'fechar': fecharModal(); break;
    case 'tv-off': fecharTV(); break;
    case 'csv-resumo': csvResumo(diaSel||hojeOp()); break;
    case 'csv-viagens': csvViagens(diaSel||hojeOp()); break;
    case 'pin-ok': tentarPin(); break;
    case 'novo-mb': modalMotoboy(0); break;
    case 'ed-mb': modalMotoboy(id); break;
    case 'conf-mb': { const nome=$('m-nome').value.trim(); if(!nome){ $('m-nome').focus(); return; } const cor=($('modal-root').querySelector('.cor-op.sel')||{}).dataset; fecharModal(); if(id) editarMotoboy(id, nome, $('m-tel').value, cor&&cor.c); else { const nid = cadastrar(nome, $('m-tel').value); if(cor&&cor.c) editarMotoboy(nid, nome, $('m-tel').value, cor.c); } break; }
    case 'arq-mb': { const m = byId(id); arquivar(id, !(m&&m.arquivado)); break; }
    case 'del-mb': modalConfirmar('Excluir motoboy', 'Apaga o cadastro de '+nomeDe(id)+'. O histórico de viagens continua com o nome.', 'Excluir', () => excluirMotoboy(id)); break;
    case 'salvar-cfg': {
      const c = S.cfg; c.loja=$('cfg-loja').value.trim()||'Tili Pizzaria'; c.alertaMin=Math.max(5,Number($('cfg-alerta').value)||30); c.criticoMin=Math.max(c.alertaMin,Number($('cfg-crit').value)||45); c.virada=Math.min(12,Math.max(0,Number($('cfg-virada').value)||0)); c.som=$('cfg-som').checked; c.pedirPedido=$('cfg-pedir').checked; c.pin=($('cfg-pin').value||'').replace(/\D/g,'').slice(0,6);
      log('CONFIG', null, `alerta ${c.alertaMin}/${c.criticoMin} min · virada ${c.virada}h · som ${c.som?'on':'off'} · pedir pedido ${c.pedirPedido?'on':'off'} · PIN ${c.pin?'definido':'sem'}`); commit(); toast('Configurações salvas', 'ok'); break; }
    case 'backup': exportarBackup(); break;
    case 'encerrar-dia': modalConfirmar('Encerrar o dia', 'Todos saem da fila e os turnos de hoje são fechados. Os números do dia ficam guardados.', 'Encerrar o dia', encerrarDia); break;
    case 'exemplo': modalConfirmar('Carregar dados de exemplo', 'Substitui tudo por um dia fictício, só para conhecer o quadro. Depois use “Apagar tudo” para começar de verdade.', 'Carregar exemplo', carregarExemplo); break;
    case 'apagar-tudo': modalConfirmar('Apagar tudo', 'Apaga motoboys, fila, viagens e histórico deste navegador. Não tem volta.', 'Apagar tudo', () => { S = estadoInicial(); log('ZEROU', null, 'tudo apagado'); adminLiberado=false; commit(); toast('Tudo apagado'); }, true); break;
  }
});
$('btn-limpar-demo').addEventListener('click', () => modalConfirmar('Apagar o exemplo', 'Remove os dados fictícios e deixa os motoboys do ALIV já cadastrados (quem não rodou nos últimos 30 dias fica arquivado em Admin).', 'Apagar exemplo', () => { semearProducao(); render(); toast('Pronto — motoboys do ALIV cadastrados', 'ok'); }));

/* ---------- relógio, alertas ---------- */
let toastTimer = null;
function toast(msg, tipo){ $('toast-root').innerHTML = `<div class="toast ${tipo||''}">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ $('toast-root').innerHTML=''; }, 2600); }
function tick(){
  $('clock').textContent = hm(agora());
  let tocar = false;
  S.rota.forEach(r => { const m = minutos(r.saiuEm, agora()); if(m >= S.cfg.criticoMin && r.alerta < 2){ r.alerta = 2; tocar = true; } else if(m >= S.cfg.alertaMin && !r.alerta){ r.alerta = 1; } });
  if(tocar){ salvar(); beep(3); }
  fecharTurnosEsquecidos();
  if(tab==='fila' && !$('modal-root').firstChild && !menuAberto) renderFila();
  if($('tv-root').firstChild) renderTV();
}
setInterval(tick, 20000);
window.addEventListener('storage', e => { if(e.key===KEY){ const s = carregar(); if(s){ S = s; render(); } } });

/* ---------- início ---------- */
S = carregar();
if(!S){ if(DEMO) carregarExemplo(); else semearProducao(); }
fecharTurnosEsquecidos();
$('clock').textContent = hm(agora());
render();
</script>
